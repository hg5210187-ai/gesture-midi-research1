[project]
name = "gesture-midi-instrument"
version = "0.1.0"
description = "Camera-based hand-gesture MIDI instrument: right hand plays pitch and volume, left hand runs a looper."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "coremltools>=9.0",
    "customtkinter>=5.2.2",
    "mediapipe>=0.10.32",
    "mido>=1.3.3",
    "numpy<=2.3.5",
    "opencv-python>=4.13.0.90",
    "pillow>=12.1.0",
    "python-rtmidi>=1.5.8",
    "ultralytics>=8.4.7",
]

[tool.uv]
# Use the system (Homebrew) Python interpreter rather than a uv-downloaded one.
# Combined with .python-version = 3.12, this points the project at
# Homebrew's python@3.12. Requires `brew install python-tk@3.12` for the
# customtkinter GUI to import _tkinter.
python-preference = "only-system"
